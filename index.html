<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Alikhan">
<title>UniFinder — университеты под твои баллы</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef2f0;--card:#fff;--ink:#10231f;--mut:#5b6e69;--line:#d5dfdb;--acc:#0b6e5a;--accs:#dff0ea;--hi:#e9a912;--warn:#8a5a00;--warns:#fdf0cf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1917;--card:#14262a;--ink:#e6f1ee;--mut:#97aca6;--line:#26403f;--acc:#3fcfa8;--accs:#17342f;--hi:#f2bd3a;--warn:#f2c35c;--warns:#3a2f12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1917;--card:#14262a;--ink:#e6f1ee;--mut:#97aca6;--line:#26403f;--acc:#3fcfa8;--accs:#17342f;--hi:#f2bd3a;--warn:#f2c35c;--warns:#3a2f12;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3,.num{font-family:"Bricolage Grotesque","Arial Narrow",sans-serif;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.wrap{width:min(1180px,100% - 28px);margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.brand{font:800 24px "Bricolage Grotesque",sans-serif}.brand i{color:var(--acc);font-style:normal}
.row{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;cursor:pointer;font-size:14px}
.pill[aria-pressed=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.hero{padding:26px 0 30px;display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:end}
.hero h1{font-size:clamp(34px,5.6vw,66px);line-height:1;margin:0;font-weight:800}
.hero p{color:var(--mut);margin:0;max-width:46ch}
.live{font-size:14px;color:var(--mut)}.live b{display:block;font:800 64px/1 "Bricolage Grotesque",sans-serif;color:var(--acc)}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.panel h2{font-size:20px;margin:0 0 4px}.sub{font-size:13px;color:var(--mut);margin:0 0 14px}
.f{margin:0 0 14px}.f label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:5px}
.f label output{color:var(--acc);font-weight:700}
select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input[type=range]{width:100%;accent-color:var(--acc);min-height:30px}
.hint{font-size:12px;color:var(--mut);margin:2px 0 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{margin:0;font-size:24px}
.bar select{width:auto;min-height:38px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;display:grid;grid-template-columns:96px 1fr;gap:18px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--hi) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:800 28px "Bricolage Grotesque",sans-serif}
.card h3{margin:0;font-size:20px;line-height:1.2}.loc{font-size:13px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accs);color:var(--acc)}
.chip.amb{background:var(--warns);color:var(--warn)}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.parts div{font-size:12px;color:var(--mut)}
.parts i{display:block;height:6px;border-radius:9px;background:var(--line);margin-top:4px;overflow:hidden}
.parts i s{display:block;height:100%;background:var(--acc)}
.notes{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--mut)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.acts a,.acts button{border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-decoration:none}
.acts a{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.acts [aria-pressed=true]{background:var(--accs);color:var(--acc);border-color:var(--acc)}
.empty{border:2px dashed var(--line);border-radius:18px;padding:40px 22px;text-align:center;color:var(--mut)}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:22px}
.note{margin:26px 0 14px;padding:16px 18px;border-radius:14px;background:var(--warns);color:var(--warn);font-size:13px}
.tray{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}
.tray button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--hi);color:#10231f}
dialog{width:min(880px,calc(100% - 20px));border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:20px}
dialog::backdrop{background:#000a}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;width:130px}
@property --p{syntax:"<number>";inherits:false;initial-value:0}
body{background:radial-gradient(900px 520px at 88% -6%,color-mix(in srgb,var(--acc) 24%,transparent),transparent 62%),radial-gradient(720px 420px at -6% 8%,color-mix(in srgb,var(--hi) 20%,transparent),transparent 62%),var(--bg);background-attachment:fixed}
.top{position:sticky;top:8px;z-index:6;margin-top:10px;padding:10px 12px 10px 18px;border:1px solid var(--line);border-radius:99px;background:color-mix(in srgb,var(--card) 70%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px -18px #0007}
.hero{position:relative;isolation:isolate}
.hero h1{background:linear-gradient(115deg,var(--ink) 35%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.orbs{position:absolute;inset:-40px 0 0;z-index:-1;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;animation:drift 16s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:260px;height:260px;right:6%;top:0;background:var(--acc)}
.orbs i:nth-child(2){width:200px;height:200px;right:26%;top:90px;background:var(--hi);animation-delay:-6s}
@keyframe
